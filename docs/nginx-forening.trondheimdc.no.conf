# forening.trondheimdc.no — static site (Next.js output: "export"), no proxy, no app server.

server {
    listen 80;
    listen [::]:80;
    server_name forening.trondheimdc.no;

    access_log /var/www/sites/forening.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/forening.trondheimdc.no/logs/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 on the listen line, not `http2 on;`: the server's nginx predates 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forening.trondheimdc.no;

    access_log /var/www/sites/forening.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/forening.trondheimdc.no/logs/error.log;

    root /var/www/sites/forening.trondheimdc.no/public;

    # Added by certbot; keep them when copying this file over.
    ssl_certificate     /etc/letsencrypt/live/forening.trondheimdc.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forening.trondheimdc.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Note: add_header in a location replaces any from the server level, so each location sets its own.

    # Hashed file names: a new deploy gets new names, so these can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages, plus /img, /fonts and /locales, which keep their names across deploys.
    # Everything is served from this origin: no third-party scripts, fonts or images.
    # Next and next-themes inline their bootstrap scripts, hence 'unsafe-inline'.
    location / {
        index index.html;
        # Always check for a new deploy, so the page never points at old /_next/static files.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # /stotte → stotte.html. No SPA fallback: every page is its own file, anything else is a 404.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
